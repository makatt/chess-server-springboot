# --- Источник данных ---------------------------------------------------------
# Значения приходят только из окружения (docker-compose передаёт их в контейнер);
# в git паролей нет. Локальные дефолты рассчитаны на `docker compose up`.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chess}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chess}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Схема создаётся скриптом docker/postgres/init/01_schema.sql, а не Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# --- Actuator: пробы живости/готовности --------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# детали (в т.ч. про БД) наружу не отдаём
management.endpoint.health.show-details=never

info.app.name=chess-server-springboot
info.app.version=@project.version@

# --- Корректная остановка контейнера (nginx не рвёт запросы) ------------------
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
