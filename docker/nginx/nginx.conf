# =============================================================================
#  Reverse proxy перед Spring Boot приложением (см. docker-compose.yml).
#  Сюда попадает весь внешний трафик; app:8080 наружу не опубликован.
# =============================================================================

# WebSocket требует проброса заголовков Upgrade/Connection
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream app_backend {
    server app:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # --- healthcheck самого nginx (используется в docker-compose) ---
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- WebSocket: игровые сессии в реальном времени ---
    location /chess {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # партия может длиться дольше дефолтных 60с — соединение не рвём
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- REST API + Swagger UI ---
    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- базовая гигиена ответов ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
