# Пример inventory. Скопируйте в inventory.ini (он в .gitignore) и подставьте хост.
#
# Требуется SSH-доступ с ключом и sudo с паролем (запуск: ansible-playbook -K site.yml).

[app_hosts]
# Чистый VPS:
# vps ansible_host=203.0.113.10 ansible_user=ubuntu
#
# Домашний сервер в tailnet (доступ по SSH внутри Tailscale, порты наружу не нужны):
# mks ansible_host=<host>.<tailnet>.ts.net ansible_user=maket
